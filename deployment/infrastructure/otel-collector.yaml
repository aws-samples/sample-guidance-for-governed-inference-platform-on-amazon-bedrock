  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: otel-collector
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: aws-otel-collector
          Image: !Ref CollectorImage
          Command:
            - --config=env:AOT_CONFIG_CONTENT
          Essential: true
          Memory: 512
          Secrets:
            - Name: AOT_CONFIG_CONTENT
              ValueFrom: !Ref OTelConfig
          PortMappings:
            - ContainerPort: 4317
              Protocol: tcp
            - ContainerPort: 4318
              Protocol: tcp
            - ContainerPort: 4319
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CollectorLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ECS Service — split into two conditional resources so that each path has
  # the correct DependsOn without referencing a conditionally-absent resource.
  # CloudFormation validates DependsOn unconditionally at parse time, so a
  # single resource cannot safely list a conditional resource as a dependency.

  # Explicit internal local-development HTTP path: wait only for HTTPListener.
  ECSServiceHTTP:
    Type: AWS::ECS::Service
    Condition: EnableInsecureHttpIngress
    DependsOn:
      - HTTPListener
    Properties:

      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: aws-otel-collector
          ContainerPort: 4318
          TargetGroupArn: !Ref HTTPTargetGroup
      HealthCheckGracePeriodSeconds: 60

  # HTTPS path (custom domain): wait for both listeners so the target group
  # association via HTTPSListener is ready before the service registers tasks
  ECSServiceHTTPS:
    Type: AWS::ECS::Service
    Condition: EnableHttps
    DependsOn:
      - HTTPListener
      - HTTPSListener
      - AggregateTargetRegistrationRule
    Properties:

      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: aws-otel-collector
          ContainerPort: 4318
          TargetGroupArn: !Ref HTTPTargetGroup
        - !If
          - HasVerifiedJwtIngress
          - ContainerName: aws-otel-collector
            ContainerPort: 4319
            TargetGroupArn: !Ref VerifiedTargetGroup
          - !Ref AWS::NoValue
      HealthCheckGracePeriodSeconds: 60

  # Fail-visible collector-down alarm: telemetry paths may degrade but must
  # degrade visibly. HealthyHostCount is emitted by the ALB per target group,
  # so it keeps reporting (at 0) while the ECS tasks are down — unlike
  # collector-emitted metrics, which simply stop. Created for both the HTTP
  # and HTTPS service variants (the target group exists in both paths).
  CollectorUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-collector-unhealthy'
      AlarmDescription: >-
        OTEL collector has no healthy ALB targets — client telemetry is being
        dropped (no backfill) and client-reported quota usage is going stale.
        See assets/docs/RUNBOOKS.md section 2.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt HTTPTargetGroup.TargetGroupFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

  # Auto Scaling - Commented out due to service-linked role requirements
  # Uncomment if you want auto-scaling and have the necessary service-linked role
  # Note: ECSService was split into ECSServiceHTTP (explicit insecure local-dev
  # opt-in) and ECSServiceHTTPS (TLS). If re-enabling auto-scaling, use the
  # variant that matches your deployment.
  #
  # ServiceScalingTarget:
  #   Type: AWS::ApplicationAutoScaling::ScalableTarget
  #   DependsOn: ECSServiceHTTPS  # or ECSServiceHTTP if not using a custom domain
  #   Properties:
  #     MaxCapacity: 3
  #     MinCapacity: 1
  #     ResourceId: !Sub 'service/${ECSCluster}/otel-collector-service'
  #     ScalableDimension: ecs:service:DesiredCount
  #     ServiceNamespace: ecs
  #
  # ServiceScalingPolicy:
  #   Type: AWS::ApplicationAutoScaling::ScalingPolicy
  #   Properties:
  #     PolicyName: otel-collector-cpu-scaling
  #     PolicyType: TargetTrackingScaling
  #     ScalingTargetId: !Ref ServiceScalingTarget
  #     TargetTrackingScalingPolicyConfiguration:
  #       PredefinedMetricSpecification:
  #         PredefinedMetricType: ECSServiceAverageCPUUtilization
  #       ScaleInCooldown: 60
  #       ScaleOutCooldown: 60
  #       TargetValue: 70

Outputs:
  VpcId:
    Description: VPC ID used
    Value: !Ref VpcId

  SubnetIds:
    Description: Subnet IDs used by the collector
    Value: !Join [',', !Ref SubnetIds]

  CollectorEndpoint:
    Description: Endpoint for OTLP metrics
    Value: !If
      - EnableHttps
      - !Sub 'https://${CustomDomainName}'
      - !Sub 'http://${LoadBalancer.DNSName}'
    Export:
      Name: !Sub '${AWS::StackName}-endpoint'

  VerifiedCollectorEndpoint:
    Description: TLS endpoint whose default listener validates OIDC JWTs before forwarding OTLP
    Condition: HasVerifiedJwtIngress
    Value: !Sub 'https://${CustomDomainName}'

  ALBEndpoint:
    Description: ALB DNS name
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-alb-dns'

  ConfigParameterName:
    Description: SSM Parameter containing collector configuration
    Value: !Ref OTelConfig

  LogGroupName:
    Description: CloudWatch Log Group for metrics (only when analytics enabled)
    Condition: AnalyticsEnabled
    Value: /aws/gip/metrics

  Note:
    Description: Important deployment information
    Value: !If
      - EnableHttps
      - !Sub |
        OTEL collector is available at: https://${CustomDomainName}
        Certificate validation is automatic via Route53.
        Claude Code settings will use this HTTPS endpoint.
      - !Sub |
        OTEL collector is available at: http://${LoadBalancer.DNSName}
        DANGER: Explicit local-development-only HTTP mode is enabled.
        Telemetry and bearer tokens are not encrypted in transit. Never use this
        mode for production or internet-facing deployments. Migrate by providing
        CustomDomainName and HostedZoneId or CertificateArn, then set
        AllowInsecureHttpIngress=false.
