AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS IAM Identity Center authentication for Governed Inference Platform on Amazon Bedrock'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Federation"
        Parameters:
          - FederatedRoleName
          - AllowedPermissionSetName
          - IdentityPoolName
      - Label:
          default: "Model governance"
        Parameters:
          - AllowedBedrockRegions
          - RestrictToAnthropicModels
      - Label:
          default: "Monitoring"
        Parameters:
          - EnableMonitoring
    ParameterLabels:
      FederatedRoleName:
        default: "Federated IAM role name"
      AllowedPermissionSetName:
        default: "IAM Identity Center permission set allowed to assume the role"
      IdentityPoolName:
        default: "Identity pool name (resource name prefix)"
      AllowedBedrockRegions:
        default: "Allowed Amazon Bedrock regions"
      RestrictToAnthropicModels:
        default: "Restrict to Anthropic models only"
      EnableMonitoring:
        default: "Enable monitoring and logging"

Parameters:
  FederatedRoleName:
    Type: String
    Default: 'BedrockIDCFederatedRole'
    Description: Name of the IAM role for IAM Identity Center federation

  AllowedPermissionSetName:
    Type: String
    Default: 'BedrockDeveloperAccess'
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,32}$'
    Description: >-
      Exact IAM Identity Center permission set name allowed to chain into the
      governed Bedrock role. The generated AWSReservedSSO role suffix remains
      wildcarded because IAM Identity Center changes it when assignments are
      recreated.
    
  IdentityPoolName:
    Type: String
    Description: Name for the identity pool (used for resource naming)
    
  AllowedBedrockRegions:
    Type: CommaDelimitedList
    Default: 'af-south-1,ap-east-2,ap-northeast-1,ap-northeast-2,ap-northeast-3,ap-south-1,ap-south-2,ap-southeast-1,ap-southeast-2,ap-southeast-3,ap-southeast-4,ca-central-1,ca-west-1,eu-central-1,eu-central-2,eu-north-1,eu-south-1,eu-south-2,eu-west-1,eu-west-2,eu-west-3,il-central-1,me-central-1,me-south-1,sa-east-1,us-east-1,us-east-2,us-west-1,us-west-2'
    Description: Comma-delimited list of AWS regions allowed for Bedrock access
    
  RestrictToAnthropicModels:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      When 'true', restricts Bedrock model invocation to Anthropic models only
      (server-side model governance; client-side model locks remain bypassable
      without it). Default 'true' enforces server-side Anthropic model scoping;
      set 'false' only for explicitly approved non-Anthropic or opaque
      application-inference-profile deployments.

  EnableMonitoring:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable monitoring and logging capabilities

Conditions:
  MonitoringEnabled: !Equals [!Ref EnableMonitoring, 'true']
  AnthropicModelsOnly: !Equals [!Ref RestrictToAnthropicModels, 'true']

Resources:
  # Customer-managed IAM policy for Bedrock access
  BedrockAccessPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: !Sub '${IdentityPoolName}-BedrockAccessPolicy'
      Description: 'Bedrock access policy for Claude Code with region restrictions'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyBedrockMantleEndpoint
            Effect: Deny
            Action: 'bedrock-mantle:*'
            Resource: '*'
          - Sid: AllowBedrockInvokeRegional
            Effect: Allow
            Action:
              - 'bedrock:InvokeModel'
              - 'bedrock:InvokeModelWithResponseStream'
              - 'bedrock:CallWithBearerToken'
              - 'bedrock:ListFoundationModels'
              - 'bedrock:ListInferenceProfiles'
            # application-inference-profile IDs are opaque and cannot be
            # pattern-matched by model, so both branches keep them.
            # inference-profile/*.anthropic.* matches the us./eu./apac./au./jp./global.
            # cross-region inference profile prefixes.
            Resource: !If
              - AnthropicModelsOnly
              - - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/*.anthropic.*'
              - - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:*:application-inference-profile/*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedBedrockRegions
          # F-011: Enforced guardrails require callers to apply the selected
          # guardrail during model invocation.
          - Sid: AllowOwnAccountGuardrails
            Effect: Allow
            Action: 'bedrock:ApplyGuardrail'
            Resource: !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:guardrail/*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedBedrockRegions
          - Sid: AllowBedrockModelInfo
            Effect: Allow
            Action:
              - 'bedrock:GetFoundationModel'
              - 'bedrock:ListFoundationModels'
            Resource: '*'
          # CloudWatch Logs (if monitoring enabled)
          - !If
            - MonitoringEnabled
            - Sid: AllowCloudWatchLogs
              Effect: Allow
              Action:
                - 'logs:CreateLogGroup'
                - 'logs:CreateLogStream'
                - 'logs:PutLogEvents'
                - 'logs:DescribeLogGroups'
                - 'logs:DescribeLogStreams'
              Resource: !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/gip/*'
            - !Ref 'AWS::NoValue'
  
  # IAM role for IAM Identity Center federation
  BedrockIDCRole:
    Type: 'AWS::IAM::Role'
    Metadata:
      guard:
        SuppressedRules:
          # Optional monitoring policy (conditional CloudWatch read) scoped to this federation role - converting to a managed policy adds no security.
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      RoleName: !Ref FederatedRoleName
      Description: 'IAM role for AWS IAM Identity Center federation to access Bedrock'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Trust only the named IAM Identity Center permission set. AWS
          # documents account-root + aws:PrincipalArn for customer-managed
          # roles; the trailing unique suffix must remain wildcarded.
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              ArnLike:
                'aws:PrincipalArn':
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_${AllowedPermissionSetName}_*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_${AllowedPermissionSetName}_*'
      ManagedPolicyArns:
        - !Ref BedrockAccessPolicy
      # Optional CloudWatch access for monitoring
      Policies: !If
        - MonitoringEnabled
        - - PolicyName: 'CloudWatchAccess'
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # Metric publishing is scoped to the usage namespaces (same
                # pattern as the bedrock-auth-* OIDC templates) so a federated
                # user cannot poison arbitrary CloudWatch namespaces.
                - Sid: AllowCloudWatchMetrics
                  Effect: Allow
                  Action:
                    - 'cloudwatch:PutMetricData'
                  Resource: '*'
                  Condition:
                    StringEquals:
                      'cloudwatch:namespace':
                        - 'GIP/Bedrock/Usage'
                        - 'AWS/Bedrock'
                # Read-only metric queries; these APIs are not resource-scoped
                # and ListMetrics without a Namespace filter must keep working.
                - Sid: AllowCloudWatchRead
                  Effect: Allow
                  Action:
                    - 'cloudwatch:GetMetricStatistics'
                    - 'cloudwatch:ListMetrics'
                  Resource: '*'
        - []
      Tags:
        - Key: 'Project'
          Value: 'GovernedInferencePlatform'
        - Key: 'Component'
          Value: 'Authentication'
        - Key: 'AuthType'
          Value: 'IDC'

Outputs:
  RoleArn:
    Description: 'ARN of the IAM role for Identity Center federation'
    Value: !GetAtt BedrockIDCRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'
      
  PolicyArn:
    Description: 'ARN of the Bedrock access policy'
    Value: !Ref BedrockAccessPolicy
    Export:
      Name: !Sub '${AWS::StackName}-PolicyArn'
      
  RoleName:
    Description: 'Name of the federated role'
    Value: !Ref BedrockIDCRole
    Export:
      Name: !Sub '${AWS::StackName}-RoleName'
