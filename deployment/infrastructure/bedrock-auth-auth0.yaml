AWSTemplateFormatVersion: '2010-09-09'
Description: 'Governed Inference Platform on Amazon Bedrock - Auth0 Authentication Stack'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Auth0 application"
        Parameters:
          - Auth0Domain
          - Auth0ClientId
          - OidcThumbprintList
      - Label:
          default: "Federation"
        Parameters:
          - FederationType
          - FederatedRoleName
          - IdentityPoolName
          - SessionNameBinding
      - Label:
          default: "Model governance"
        Parameters:
          - AllowedBedrockRegions
          - RestrictToAnthropicModels
      - Label:
          default: "Monitoring"
        Parameters:
          - EnableMonitoring
    ParameterLabels:
      FederationType:
        default: "Federation method"
      IdentityPoolName:
        default: "Identity pool name (resource name prefix)"
      FederatedRoleName:
        default: "Federated IAM role name"
      AllowedBedrockRegions:
        default: "Allowed Amazon Bedrock regions"
      RestrictToAnthropicModels:
        default: "Restrict to Anthropic models only"
      EnableMonitoring:
        default: "Enable CloudWatch monitoring"
      SessionNameBinding:
        default: "Bind STS session name to identity claim"
      Auth0Domain:
        default: "Auth0 domain"
      Auth0ClientId:
        default: "Auth0 application client ID"
      OidcThumbprintList:
        default: "IAM OIDC provider thumbprint(s) (optional; keep current list on update)"

Parameters:
  FederationType:
    Type: String
    Default: direct
    AllowedValues:
      - direct
      - cognito
    Description: Authentication mode - Direct IAM or Cognito Identity Pool

  Auth0Domain:
    Type: String
    Description: |
      Your Auth0 domain (e.g., company.auth0.com or company.us.auth0.com).
      Supported formats:
        - company.auth0.com (standard domain)
        - company.us.auth0.com (region-specific domain)
        - company.eu.auth0.com (European region)
        - company.au.auth0.com (Australia region)
        - company.jp.auth0.com (Japan region)
      Note: Do NOT include 'https://' prefix or trailing slash - these are added automatically.
    AllowedPattern: '^[a-zA-Z0-9][a-zA-Z0-9-]*\.(us|eu|au|jp)?\.?auth0\.com$'
    ConstraintDescription: Must be a valid Auth0 domain without https:// prefix or trailing slash

  Auth0ClientId:
    Type: String
    Description: Auth0 application client ID
    AllowedPattern: '^[a-zA-Z0-9]{32}$'
    ConstraintDescription: Must be a valid Auth0 client ID

  OidcThumbprintList:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      IAM OIDC provider certificate thumbprint list (40 hex chars each,
      comma-separated). Leave empty for a NEW stack: IAM retrieves the top
      intermediate CA thumbprint itself and validates the JWKS endpoint's TLS
      certificate against its trusted root CA library; supply a value only for a
      JWKS host whose certificate is signed by a private CA. When UPDATING a stack
      whose provider already has thumbprints, pass its current list (aws iam
      get-open-id-connect-provider): IAM rejects removing them ("thumbprintList
      ... Member must not be null"). `gip deploy` does this automatically. See
      https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc_verify-thumbprint.html

  IdentityPoolName:
    Type: String
    Default: gip-auth0
    Description: Name for the Cognito Identity Pool (used in cognito mode)
    AllowedPattern: '^[\w\s+=,.@-]+$'
    MaxLength: 128

  FederatedRoleName:
    Type: String
    Default: BedrockAuth0FederatedRole
    Description: Name for the IAM role used for federation
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9-_]*$'
    MaxLength: 64

  AllowedBedrockRegions:
    Type: CommaDelimitedList
    Default: 'af-south-1,ap-east-2,ap-northeast-1,ap-northeast-2,ap-northeast-3,ap-south-1,ap-south-2,ap-southeast-1,ap-southeast-2,ap-southeast-3,ap-southeast-4,ca-central-1,ca-west-1,eu-central-1,eu-central-2,eu-north-1,eu-south-1,eu-south-2,eu-west-1,eu-west-2,eu-west-3,il-central-1,me-central-1,me-south-1,sa-east-1,us-east-1,us-east-2,us-west-1,us-west-2'
    Description: AWS regions allowed for Bedrock access (auto-generated from supported model regions)

  RestrictToAnthropicModels:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      When 'true', restricts Bedrock model invocation to Anthropic models only
      (server-side model governance; client-side model locks remain bypassable
      without it). Default 'true' enforces server-side Anthropic model scoping;
      set 'false' only for explicitly approved non-Anthropic or opaque
      application-inference-profile deployments.

  EnableMonitoring:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable CloudWatch monitoring for Bedrock usage

  SessionNameBinding:
    Type: String
    Default: none
    AllowedValues:
      - none
      - email
    Description: >-
      Opt-in trust-policy binding of the STS RoleSessionName to an IdP-signed
      token claim (direct federation only). 'none' (default) preserves the
      current client-chosen session name. 'email' adds an sts:RoleSessionName
      condition so STS rejects any AssumeRoleWithWebIdentity call whose
      session name is not exactly the validated email claim, making CUR
      per-user cost attribution tamper-proof. 'sub' is not offered for Auth0:
      its subject claims contain '|', which STS forbids in session names.

Conditions:
  UseDirectIAM: !Equals [!Ref FederationType, direct]
  UseCognitoIdentity: !Equals [!Ref FederationType, cognito]
  MonitoringEnabled: !Equals [!Ref EnableMonitoring, 'true']
  AnthropicModelsOnly: !Equals [!Ref RestrictToAnthropicModels, 'true']
  BindSessionToEmail: !Equals [!Ref SessionNameBinding, email]
  BindSessionToSub: !Equals [!Ref SessionNameBinding, sub]
  BindSessionName: !Or [!Condition BindSessionToEmail, !Condition BindSessionToSub]
  # An empty CommaDelimitedList joins to ''. Only then is ThumbprintList sent.
  HasOidcThumbprints: !Not [!Equals [!Join ['', !Ref OidcThumbprintList], '']]
  # Partition-aware conditions for Cognito Identity service principals
  IsGovCloudWest: !Equals [!Ref 'AWS::Region', 'us-gov-west-1']
  IsGovCloudEast: !Equals [!Ref 'AWS::Region', 'us-gov-east-1']

Resources:
  # ===============================================
  # OIDC Provider for Auth0
  # ===============================================

  Auth0OIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !Sub 'https://${Auth0Domain}/'
      ClientIdList:
        - !Ref Auth0ClientId
      # ThumbprintList is optional on create: omitted, IAM retrieves the top intermediate
      # CA thumbprint itself and validates the JWKS TLS cert against its trusted root CA
      # library (configured thumbprints are used only for private-CA IdPs). On update,
      # IAM rejects removing an existing list, so the parameter carries it through.
      # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-iam-oidcprovider.html
      # https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc_verify-thumbprint.html
      ThumbprintList: !If [HasOidcThumbprints, !Ref OidcThumbprintList, !Ref 'AWS::NoValue']
      Tags:
        - Key: Purpose
          Value: Claude Code Auth0 Authentication
        - Key: Provider
          Value: Auth0

  # ===============================================
  # Bedrock Access Policy (Shared)
  # ===============================================

  BedrockAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: "List/Get Bedrock actions require Resource: * as they are non-resource-specific API calls"
    Properties:
      Description: Policy for accessing Bedrock services
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyBedrockMantleEndpoint
            Effect: Deny
            Action: 'bedrock-mantle:*'
            Resource: '*'
          - Sid: AllowBedrockInvokeRegional
            Effect: Allow
            Action:
              - 'bedrock:InvokeModel'
              - 'bedrock:InvokeModelWithResponseStream'
              - 'bedrock:CallWithBearerToken'
              - 'bedrock:ListFoundationModels'
              - 'bedrock:ListInferenceProfiles'
            # inference-profile/*.anthropic.* matches the us./eu./apac./au./jp./global.
            # cross-region inference profile prefixes.
            Resource: !If
              - AnthropicModelsOnly
              - - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/*.anthropic.*'
              - - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:*:application-inference-profile/*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedBedrockRegions
          - Sid: AllowBedrockInvokeGlobal
            Effect: Allow
            Action:
              - 'bedrock:InvokeModel'
              - 'bedrock:InvokeModelWithResponseStream'
              - 'bedrock:CallWithBearerToken'
              - 'bedrock:ListFoundationModels'
              - 'bedrock:ListInferenceProfiles'
            Resource: !If
              - AnthropicModelsOnly
              - - !Sub 'arn:${AWS::Partition}:bedrock:::foundation-model/anthropic.*'
              - - !Sub 'arn:${AWS::Partition}:bedrock:::foundation-model/*'
          # F-011: Enforced guardrails require callers to apply the selected
          # guardrail during model invocation.
          - Sid: AllowOwnAccountGuardrails
            Effect: Allow
            Action: 'bedrock:ApplyGuardrail'
            Resource: !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:guardrail/*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedBedrockRegions
          - Sid: AllowBedrockListRegional
            Effect: Allow
            Action:
              - 'bedrock:ListFoundationModels'
              - 'bedrock:GetFoundationModel'
              - 'bedrock:GetFoundationModelAvailability'
              - 'bedrock:ListInferenceProfiles'
              - 'bedrock:GetInferenceProfile'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedBedrockRegions
          - Sid: AllowBedrockListGlobal
            Effect: Allow
            Action:
              - 'bedrock:ListFoundationModels'
              - 'bedrock:GetFoundationModel'
              - 'bedrock:GetFoundationModelAvailability'
              - 'bedrock:ListInferenceProfiles'
              - 'bedrock:GetInferenceProfile'
            Resource: '*'
          - !If
            - MonitoringEnabled
            - Sid: AllowCloudWatchMetrics
              Effect: Allow
              Action:
                - 'cloudwatch:PutMetricData'
              Resource: '*'
              Condition:
                StringEquals:
                  'cloudwatch:namespace':
                    - 'GIP/Bedrock/Usage'
                    - 'AWS/Bedrock'
            - !Ref 'AWS::NoValue'

  # ===============================================
  # Direct IAM Resources (when FederationType=direct)
  # ===============================================

  DirectIAMRole:
    Type: AWS::IAM::Role
    Condition: UseDirectIAM
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit role name required for cross-stack reference stability and user-facing configuration"
    Properties:
      RoleName: !Ref FederatedRoleName
      Description: Direct IAM role for Auth0 users accessing Bedrock
      MaxSessionDuration: 43200 # 12 hours
      # Fn::Sub renders the issuer-derived condition key. The audience pin is
      # unconditional; SessionNameBinding adds its condition to the same block.
      AssumeRolePolicyDocument: !If
        - BindSessionName
        - !Sub
          - |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Principal": {"Federated": "${ProviderArn}"},
                "Action": ["sts:AssumeRoleWithWebIdentity", "sts:TagSession"],
                "Condition": {"StringEquals": {"${Issuer}:aud": "${ClientId}", "sts:RoleSessionName": "${SessionClaim}"}}
              }]
            }
          - ProviderArn: !GetAtt Auth0OIDCProvider.Arn
            Issuer: !Ref Auth0Domain
            ClientId: !Ref Auth0ClientId
            SessionClaim: !Join ['', ['${', !Ref Auth0Domain, ':email}']]
        - !Sub
          - |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Principal": {"Federated": "${ProviderArn}"},
                "Action": ["sts:AssumeRoleWithWebIdentity", "sts:TagSession"],
                "Condition": {"StringEquals": {"${Issuer}:aud": "${ClientId}"}}
              }]
            }
          - ProviderArn: !GetAtt Auth0OIDCProvider.Arn
            Issuer: !Ref Auth0Domain
            ClientId: !Ref Auth0ClientId
      ManagedPolicyArns:
        - !Ref BedrockAccessPolicy
      Tags:
        - Key: Purpose
          Value: Claude Code Direct IAM Authentication
        - Key: Provider
          Value: Auth0
        - Key: FederationType
          Value: direct

  # ===============================================
  # Cognito Identity Pool Resources (when FederationType=cognito)
  # ===============================================

  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Condition: UseCognitoIdentity
    Properties:
      IdentityPoolName: !Ref IdentityPoolName
      AllowUnauthenticatedIdentities: false
      AllowClassicFlow: false
      OpenIdConnectProviderARNs:
        - !GetAtt Auth0OIDCProvider.Arn

  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Condition: UseCognitoIdentity
    Properties:
      Description: Role for authenticated Cognito Identity Pool users
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - IsGovCloudWest
                - cognito-identity-us-gov.amazonaws.com
                - !If
                  - IsGovCloudEast
                  - cognito-identity.us-gov-east-1.amazonaws.com
                  - cognito-identity.amazonaws.com
            Action:
              - 'sts:AssumeRoleWithWebIdentity'
              - 'sts:TagSession'
            Condition:
              StringEquals:
                !If
                  - IsGovCloudWest
                  - 'cognito-identity-us-gov.amazonaws.com:aud': !Ref CognitoIdentityPool
                  - !If
                    - IsGovCloudEast
                    - 'cognito-identity.us-gov-east-1.amazonaws.com:aud': !Ref CognitoIdentityPool
                    - 'cognito-identity.amazonaws.com:aud': !Ref CognitoIdentityPool
              'ForAnyValue:StringLike':
                !If
                  - IsGovCloudWest
                  - 'cognito-identity-us-gov.amazonaws.com:amr': authenticated
                  - !If
                    - IsGovCloudEast
                    - 'cognito-identity.us-gov-east-1.amazonaws.com:amr': authenticated
                    - 'cognito-identity.amazonaws.com:amr': authenticated
      ManagedPolicyArns:
        - !Ref BedrockAccessPolicy
      Tags:
        - Key: Purpose
          Value: Claude Code Cognito Authentication
        - Key: Provider
          Value: Auth0

  CognitoUnauthenticatedRole:
    Type: AWS::IAM::Role
    Condition: UseCognitoIdentity
    Metadata:
      guard:
        SuppressedRules:
          # Single-purpose policy scoped to this role only - converting to a
          # managed policy adds no security.
          - IAM_NO_INLINE_POLICY_CHECK
    Properties:
      Description: Role for unauthenticated Cognito Identity Pool users (restricted)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - IsGovCloudWest
                - cognito-identity-us-gov.amazonaws.com
                - !If
                  - IsGovCloudEast
                  - cognito-identity.us-gov-east-1.amazonaws.com
                  - cognito-identity.amazonaws.com
            Action:
              - 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                !If
                  - IsGovCloudWest
                  - 'cognito-identity-us-gov.amazonaws.com:aud': !Ref CognitoIdentityPool
                  - !If
                    - IsGovCloudEast
                    - 'cognito-identity.us-gov-east-1.amazonaws.com:aud': !Ref CognitoIdentityPool
                    - 'cognito-identity.amazonaws.com:aud': !Ref CognitoIdentityPool
              'ForAnyValue:StringLike':
                !If
                  - IsGovCloudWest
                  - 'cognito-identity-us-gov.amazonaws.com:amr': unauthenticated
                  - !If
                    - IsGovCloudEast
                    - 'cognito-identity.us-gov-east-1.amazonaws.com:amr': unauthenticated
                    - 'cognito-identity.amazonaws.com:amr': unauthenticated
      Policies:
        - PolicyName: DenyAll
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                Action: '*'
                Resource: '*'
      Tags:
        - Key: Purpose
          Value: Claude Code Cognito Unauthenticated Role
        - Key: Provider
          Value: Auth0

  CognitoIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Condition: UseCognitoIdentity
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthenticatedRole.Arn
        unauthenticated: !GetAtt CognitoUnauthenticatedRole.Arn

  # Principal Tag Mapping for Session Tags
  IdentityPoolPrincipalTag:
    Type: AWS::Cognito::IdentityPoolPrincipalTag
    Condition: UseCognitoIdentity
    DeletionPolicy: Delete
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      IdentityProviderName: !Ref Auth0Domain
      UseDefaults: false
      PrincipalTags:
        UserEmail: email
        UserId: sub
        UserName: name

  # ===============================================
  # Optional Monitoring Resources
  # ===============================================

  BedrockAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: MonitoringEnabled
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "Log group contains non-sensitive Bedrock invocation metadata; KMS encryption adds cost without security benefit here"
    Properties:
      LogGroupName: !Sub '/aws/bedrock/gip-${AWS::StackName}'
      RetentionInDays: 30

Outputs:
  FederationType:
    Description: Current federation type configuration
    Value: !Ref FederationType
    Export:
      Name: !Sub '${AWS::StackName}-FederationType'

  OIDCProviderArn:
    Description: ARN of the Auth0 OIDC Provider
    Value: !GetAtt Auth0OIDCProvider.Arn
    Export:
      Name: !Sub '${AWS::StackName}-OIDCProviderArn'

  FederatedRoleArn:
    Description: ARN of the federated role for Auth0 users
    Value: !If
      - UseDirectIAM
      - !GetAtt DirectIAMRole.Arn
      - !GetAtt CognitoAuthenticatedRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FederatedRoleArn'

  DirectSTSRoleArn:
    Description: Direct STS federated role ARN (when using direct IAM)
    Condition: UseDirectIAM
    Value: !GetAtt DirectIAMRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DirectSTSRoleArn'

  BedrockRoleArn:
    Description: IAM Role ARN for Bedrock access (for backward compatibility)
    Value: !If
      - UseDirectIAM
      - !GetAtt DirectIAMRole.Arn
      - !GetAtt CognitoAuthenticatedRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BedrockRoleArn'

  IdentityPoolId:
    Description: Cognito Identity Pool ID (if using Cognito mode)
    Condition: UseCognitoIdentity
    Value: !Ref CognitoIdentityPool
    Export:
      Name: !Sub '${AWS::StackName}-IdentityPoolId'

  BedrockPolicyArn:
    Description: ARN of the Bedrock access policy
    Value: !Ref BedrockAccessPolicy
    Export:
      Name: !Sub '${AWS::StackName}-BedrockPolicyArn'

  ConfigurationJson:
    Description: Configuration JSON for CLI tool
    Value: !If
      - UseDirectIAM
      - !Sub |
        {
          "federation_type": "direct",
          "provider_type": "auth0",
          "provider_domain": "${Auth0Domain}",
          "client_id": "${Auth0ClientId}",
          "federated_role_arn": "${DirectIAMRole.Arn}",
          "aws_region": "${AWS::Region}",
          "max_session_duration": 43200
        }
      - !Sub |
        {
          "federation_type": "cognito",
          "provider_type": "auth0",
          "provider_domain": "${Auth0Domain}",
          "client_id": "${Auth0ClientId}",
          "identity_pool_id": "${CognitoIdentityPool}",
          "federated_role_arn": "${CognitoAuthenticatedRole.Arn}",
          "aws_region": "${AWS::Region}"
        }
