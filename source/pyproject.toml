[tool.poetry]
name = "governed-inference-platform"
version = "2.5.2"
description = "Deploy and manage a governed AI inference platform on Amazon Bedrock"
authors = ["Governed Inference Platform Team <gip@example.com>"]
readme = "../README.md"
license = "MIT"
keywords = ["aws", "bedrock", "ai", "inference", "governance", "authentication", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    { include = "credential_provider" },
    { include = "governed_inference_platform" }
]
# `gip console` SPA — non-Python package data that must ship in the wheel/sdist
include = [
    { path = "governed_inference_platform/console/static/*.html", format = ["sdist", "wheel"] }
]

[tool.poetry.scripts]
gip = "governed_inference_platform.cli:main"
credential-provider = "credential_provider:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
boto3 = ">=1.43.69,<2.0.0"
requests = "^2.33.1"
PyJWT = "^2.8.0"
keyring = ">=24.0.0,<26.0.0"
cryptography = ">=44.0.1"
cleo = "^2.0.0"
rich = ">=14.3.3,<16.0.0"
pydantic = "^2.12.5"
pyyaml = "^6.0"
questionary = "^2.1.1"
cfn-flip = "^1.3.0"
jsonschema = "^4.25.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
black = "^26.3.1"
nuitka = "^4.0.8"
ordered-set = "^4.1.0"
zstandard = "^0.25.0"
pyinstaller = "^6.19.0"
ruff = ">=0.15.10,<0.17.0"
mypy = ">=1.20,<3.0"
types-requests = "*"
pre-commit = "^4.5.1"
cfn-lint = "^1.48.1"
yamllint = "^1.38.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long — enforced by formatter, not linter
    "E741",  # ambiguous variable name — pre-existing in tests, cosmetic
    "B904",  # raise from err — requires careful behavioral review
]

[tool.ruff.lint.per-file-ignores]
"credential_provider/__main__.py" = ["E501", "F841"]  # Pre-existing issues in HTML templates and quota page

[tool.black]
line-length = 120
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
