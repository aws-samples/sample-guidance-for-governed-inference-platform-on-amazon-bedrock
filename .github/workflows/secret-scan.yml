name: Secret scan

# Scans the full git history and the working tree with a checksum-pinned
# gitleaks release. A self-test runs first: it plants a freshly generated fake
# AWS access key in a temporary directory and fails the job unless gitleaks
# reports exactly that finding, so a broken download, a bad config or an
# over-broad allowlist cannot pass silently. Synthetic test values are
# allowlisted in .gitleaks.toml.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (history + tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # From gitleaks_8.30.1_checksums.txt on the official v8.30.1 release.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-pinned)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Self-test (a planted fake credential must be detected)
        run: |
          set -euo pipefail
          canary="$(mktemp -d)"
          # Generated at run time, so no credential-shaped literal lives in the repo.
          # gitleaks' aws-access-token rule needs Shannon entropy >= 3; about 1 key in
          # 5,100 falls below that, so draw until entropy >= 3.5 (bounded at 100 tries).
          key="$(python3 - <<'PY'
          import base64, math, secrets, sys
          from collections import Counter

          def entropy(s):
              return -sum(c / len(s) * math.log2(c / len(s)) for c in Counter(s).values())

          for _ in range(100):
              candidate = "AKIA" + base64.b32encode(secrets.token_bytes(10)).decode()
              if entropy(candidate) >= 3.5:
                  print(candidate)
                  break
          else:
              sys.exit("could not generate a canary key with entropy >= 3.5")
          PY
          )"
          printf 'aws_access_key_id = %s\n' "${key}" > "${canary}/credentials"
          rc=0
          "${RUNNER_TEMP}/gitleaks" dir --no-banner --redact --config .gitleaks.toml \
            --exit-code 3 --report-format json --report-path "${canary}/report.json" "${canary}" || rc=$?
          # Exit 3 means "leaks found"; any other code is a scanner error or a miss.
          if [ "${rc}" -ne 3 ]; then
            echo "::error::gitleaks self-test failed: planted key not detected (exit ${rc})"
            exit 1
          fi
          python3 - "${canary}/report.json" <<'PY'
          import json, sys
          findings = json.load(open(sys.argv[1], encoding="utf-8"))
          rules = sorted({f["RuleID"] for f in findings})
          if rules != ["aws-access-token"] or len(findings) != 1:
              sys.exit(f"::error::unexpected self-test findings: {rules} ({len(findings)})")
          print("Self-test passed: the planted AWS access key was detected.")
          PY

      - name: Scan full git history
        run: |
          "${RUNNER_TEMP}/gitleaks" git --no-banner --redact --config .gitleaks.toml --exit-code 1 .

      - name: Scan working tree
        run: |
          "${RUNNER_TEMP}/gitleaks" dir --no-banner --redact --config .gitleaks.toml --exit-code 1 .
