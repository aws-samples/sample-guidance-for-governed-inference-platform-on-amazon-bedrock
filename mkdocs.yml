site_name: Governed AI Inference Platform on Amazon Bedrock
site_description: Enterprise guidance for a governed Bedrock inference endpoint — SSO, budgets, attribution, and model governance for Claude Code, Claude Desktop (Cowork), and any AWS-SDK harness
site_url: https://aws-samples.github.io/sample-guidance-for-governed-inference-platform-on-amazon-bedrock/
repo_url: https://github.com/aws-samples/sample-guidance-for-governed-inference-platform-on-amazon-bedrock
repo_name: aws-samples/sample-guidance-for-governed-inference-platform-on-amazon-bedrock
edit_uri: edit/main/

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font: false
  icon:
    logo: custom/aws
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
    - toc.integrate

extra_css:
  - stylesheets/custom.css?v=11

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      enable_git_follow: false
      strict: false
      type: timeago

hooks:
  - docs/mkdocs_hooks.py

validation:
  links:
    anchors: warn
    unrecognized_links: warn

